# Isolated Airbnb OGX stack on :8322 using local Ollama qwen2.5:14b.
# Separate storage from the Gemini Airbnb runtime and from Klarna :8321.
version: 2
distro_name: starter
apis:
- inference
- interactions
- messages
- responses
- tool_groups
- tool_runtime
- vector_io
- files
- file_processors
providers:
  inference:
  - provider_id: openai
    provider_type: remote::vllm
    config:
      api_token: local-ollama-placeholder
      base_url: http://127.0.0.1:11434/v1
  interactions:
  - provider_id: builtin
    provider_type: inline::builtin
    config:
      store:
        table_name: interactions
        backend: sql_default
  messages:
  - provider_id: builtin
    provider_type: inline::builtin
    config:
      kvstore:
        backend: kv_default
        namespace: message_batches
  responses:
  - provider_id: builtin
    provider_type: inline::builtin
    config:
      persistence:
        responses:
          table_name: responses
          backend: sql_default
          max_write_queue_size: 10000
          num_writers: 4
  vector_io:
  - provider_id: sqlite-vec
    provider_type: inline::sqlite-vec
    config:
      db_path: ${env.OGX_EVAL_STORAGE_DIR:=runs/ogx-airbnb-local-runtime/storage}/sqlite_vec.db
      persistence:
        namespace: vector_io::sqlite_vec
        backend: kv_default
  files:
  - provider_id: builtin-files
    provider_type: inline::localfs
    config:
      storage_dir: ${env.OGX_EVAL_STORAGE_DIR:=runs/ogx-airbnb-local-runtime/storage}/files
      metadata_store:
        table_name: files_metadata
        backend: sql_default
  file_processors:
  - provider_id: auto
    provider_type: inline::auto
  tool_runtime:
  - provider_id: model-context-protocol
    provider_type: remote::model-context-protocol
  batches:
  - provider_id: reference
    provider_type: inline::reference
    config:
      sqlstore:
        table_name: batches
        backend: sql_default
storage:
  backends:
    kv_default:
      type: kv_sqlite
      db_path: ${env.OGX_EVAL_STORAGE_DIR:=runs/ogx-airbnb-local-runtime/storage}/kvstore.db
    sql_default:
      type: sql_sqlite
      db_path: ${env.OGX_EVAL_STORAGE_DIR:=runs/ogx-airbnb-local-runtime/storage}/sql_store.db
  stores:
    metadata:
      namespace: registry
      backend: kv_default
    inference:
      table_name: inference_store
      backend: sql_default
      max_write_queue_size: 10000
      num_writers: 4
    conversations:
      table_name: openai_conversations
      backend: sql_default
    prompts:
      table_name: prompts
      backend: sql_default
    connectors:
      table_name: connectors
      backend: sql_default
registered_resources:
  models:
  - metadata: {}
    model_id: qwen2.5:14b
    provider_id: openai
    provider_model_id: qwen2.5:14b
    model_type: llm
server:
  port: 8322
  host: 127.0.0.1
  workers: 1
connectors: []
